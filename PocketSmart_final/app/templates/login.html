{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<div class="auth-card"><h1>Welcome back</h1><form id="loginForm"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn">Login</button><p id="message" class="message"></p></form><p>New here? <a href="/register">Create an account</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(r.ok)location.href='/dashboard';else document.getElementById('message').textContent=d.detail||'Login failed';});</script>{% endblock %}
