{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="page"><h1>Home Interior Budget Planner</h1><form id="homeForm" class="planner-form"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Rooms<input name="rooms" placeholder="Living Room, Bedroom" required></label><label>Items<input name="items" placeholder="Lights:2, Fan:1, Dining table:1" required></label><label>Style<input name="style" value="modern"></label><label>City<input name="city" value="Mumbai"></label><button class="btn">Generate recommendations</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', path='js/planners.js') }}"></script><script>bindHomePlanner();</script>{% endblock %}
