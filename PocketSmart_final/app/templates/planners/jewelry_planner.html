{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="page"><h1>Jewelry Budget Planner</h1><form id="jewelryForm" class="planner-form" enctype="multipart/form-data"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding, party, office" required></label><label>Style<input name="style" value="versatile"></label><label>Metal<input name="metal" value="Any"></label><label>City<input name="city" value="Mumbai"></label><label>Outfit notes<textarea name="outfit_notes" placeholder="Colors, neckline, formality..."></textarea></label><label>Optional outfit image<input type="file" name="outfit" accept="image/jpeg,image/png,image/webp"></label><button class="btn">Generate recommendations</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', path='js/planners.js') }}"></script><script>bindJewelryPlanner();</script>{% endblock %}
