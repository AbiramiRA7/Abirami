{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="page"><h1>Party Budget Planner</h1><form id="partyForm" class="planner-form"><label>Budget (₹)<input type="number" name="budget" min="1" required></label><label>Guests<input type="number" name="guests" min="1" required></label><label>Event type<input name="event_type" placeholder="Birthday, wedding, corporate" required></label><label>Venue<input name="venue" value="Flexible"></label><label>City<input name="city" value="Mumbai"></label><label>Preferences<textarea name="preferences"></textarea></label><button class="btn">Generate recommendations</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', path='js/planners.js') }}"></script><script>bindPartyPlanner();</script>{% endblock %}
