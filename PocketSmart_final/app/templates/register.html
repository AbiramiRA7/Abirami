{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="auth-card"><h1>Create your account</h1><form id="registerForm"><label>Name<input name="name" minlength="2" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="btn">Register</button><p id="message" class="message"></p></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(r.ok){localStorage.setItem('token',d.access_token);location.href='/dashboard'}else document.getElementById('message').textContent=d.detail||'Registration failed';});</script>{% endblock %}
