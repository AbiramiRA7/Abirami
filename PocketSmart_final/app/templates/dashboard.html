{% extends 'base.html' %}{% block title %}Dashboard{% endblock %}{% block content %}<section class="page"><h1>Your Dashboard</h1><div id="dashboard" class="grid three"><div class="card"><h3>Account</h3><p id="account">Loading...</p></div><div class="card"><h3>Recent activity</h3><p id="activity">Loading...</p></div><div class="card"><h3>Quick actions</h3><a class="btn" href="/planner/home">New plan</a></div></div></section>{% endblock %}{% block scripts %}<script>fetch('/api/session-info').then(r=>r.json()).then(d=>document.getElementById('account').textContent=d.user?d.user.name+' · '+d.user.email:'Not logged in').catch(()=>location.href='/login');fetch('/api/session-data').then(r=>r.json()).then(d=>document.getElementById('activity').textContent=(d.recent_activity||[]).length+' recent plans');</script>{% endblock %}
