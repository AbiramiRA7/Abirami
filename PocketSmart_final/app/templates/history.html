{% extends 'base.html' %}{% block title %}History{% endblock %}{% block content %}<section class="page"><h1>Recommendation History</h1><div id="history" class="stack">Loading...</div></section>{% endblock %}{% block scripts %}<script>fetch('/api/history').then(async r=>{if(!r.ok){location.href='/login';return}return r.json()}).then(rows=>{const el=document.getElementById('history');el.innerHTML='';if(!rows?.length){el.innerHTML='<div class="card">No recommendations yet.</div>';return}rows.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+x.planner.toUpperCase()+'</h3><p>'+new Date(x.created_at).toLocaleString()+'</p><p>'+x.response.summary+'</p><a href="/api/recommendations-details/'+x.id+'" target="_blank">View JSON</a>';el.appendChild(d)})})</script>{% endblock %}
